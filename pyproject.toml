[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oke-llm-serving"
version = "0.1.0"
description = "Model-first requirements discovery for OCI OKE LLM serving"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oke-llm = "oke_llm_serving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
