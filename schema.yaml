title: OKE LLM discovery
description: Inspect a public Hugging Face model and assess GPU shapes, entitlement and host capacity across READY subscribed regions. Creates no GPU instances.
schemaVersion: 1.1.0
version: "0.1.0"
outputs:
  recommended_launch_url:
    type: link
    title: Recommended option only
    displayText: Deploy recommended option
  deployment_option_count:
    type: number
    title: Available infrastructure options
  deployment_options:
    type: json
    title: All regions and GPU options (choose any launch_url)
primaryOutputButton: ${recommended_launch_url}
variableGroups:
  - title: Model and serving assumptions
    variables: [model, revision, context_length, concurrency, monitoring_enabled, autoscaling_enabled, model_storage_mode]
  - title: Capacity observation
    variables: [observation_id, compartment_id, regions, shape_names, query_resource_availability, only_shapes_with_limits]
  - title: Infrastructure launch bundles
    variables: [publish_infrastructure_bundles, artifact_compartment_id, par_lifetime_hours, skip_gpu_allocation]
  - title: OCI context
    visible: false
    variables: [tenancy_ocid, compartment_ocid, region]
variables:
  model_storage_mode:
    type: enum
    enum: [direct_huggingface, object_storage]
    default: direct_huggingface
    title: Model distribution
    description: Direct download needs no staging bucket. Object Storage staging requires a tested staging image and CPU placement, reviewed in the generated infrastructure stack.
  monitoring_enabled:
    type: boolean
    default: true
    title: Monitor serving workloads
    description: Recommend Prometheus monitoring. Compatible existing monitoring can be reused when configuring the infrastructure stack.
  autoscaling_enabled:
    type: boolean
    default: false
    title: Enable workload autoscaling
    description: Opt in to KEDA and request metrics. GPU hosts stay allocated; this does not enable node autoscaling. Fixed replicas can use spare GPUs with this option off.
  skip_gpu_allocation:
    type: boolean
    default: false
    title: Debug only — skip GPU allocation in generated stacks
    description: Generated stacks still create DevOps resources and can install shared CPU controllers. Normal deployments allocate GPUs; discovery itself never allocates GPUs.
  compartment_ocid:
    type: string
    visible: false
  publish_infrastructure_bundles:
    type: boolean
    default: true
    title: Publish configured infrastructure ZIPs
    description: Apply creates private Object Storage artifacts and expiring launch links. No GPU hosts are allocated.
  artifact_compartment_id:
    type: oci:identity:compartment:id
    required: false
    title: Optional artifact compartment override
    description: Defaults to this RMS stack's compartment.
  par_lifetime_hours:
    type: integer
    default: 24
    minimum: 1
    maximum: 168
    title: Launch ZIP link lifetime (hours)
  tenancy_ocid:
    type: string
    title: Tenancy OCID
    required: true
    visible: false
  region:
    type: string
    title: Initial connection hint
    description: Normally empty. The CLI infers an initial endpoint from its principal or profile, then discovers the tenancy home region.
    required: false
    default: ""
    visible: false
  model:
    type: string
    title: Hugging Face model URL or ID
    required: true
    description: Enter https://huggingface.co/owner/model or owner/model. Recipe coverage is checked separately from this input.
  revision:
    type: string
    title: Model revision
    default: main
  context_length:
    type: integer
    title: Context tokens per sequence
    minimum: 1
  concurrency:
    type: integer
    title: Concurrent sequences
    minimum: 1
  observation_id:
    type: string
    title: Capacity observation identifier
    description: Change for each new capacity report. Reusing this identifier preserves the previous snapshot.
  compartment_id:
    type: oci:identity:compartment:id
    title: Intended deployment compartment (optional)
    required: false
    description: Quota/headroom scope only; capacity uses tenancy root. Leaving unset checks root entitlement.
  regions:
    type: list
    valueType: region_scope_item
    required: false
    default: "[]"
    title: Optional region subset
    description: Empty means all READY subscribed regions.
  shape_names:
    type: list
    valueType: shape_scope_item
    required: false
    default: "[]"
    title: Optional GPU shape subset
    description: Empty means all visible GPU shapes.
  query_resource_availability:
    type: boolean
    title: Query supported limit headroom
  only_shapes_with_limits:
    type: boolean
    title: Only check shapes with configured limits
    default: false
    description: Skip confirmed zero-limit shapes. Leave disabled to find capacity for limit-increase requests. Unknown quota mappings remain included.
  region_scope_item:
    type: oci:identity:region:name
    title: Region to include
    visible: false
  shape_scope_item:
    type: string
    title: GPU shape name
    description: Exact OCI shape name, for example BM.GPU.H100.8. Leave the list empty to search all GPU shapes.
    visible: false
