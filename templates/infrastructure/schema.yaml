title: OKE retained GPU infrastructure
description: Apply creates DevOps platform resources and GPU infrastructure in
  an existing cluster. The temporary debug switch skips GPU allocation only. Run
  the bootstrap pipeline to install shared CPU controllers. No models are
  deployed.
schemaVersion: 1.1.0
version: "0.1.0"
outputs:
  infrastructure_preview:
    type: json
    title: Selected infrastructure and debug scope
  platform:
    type: json
    title: DevOps project, bootstrap pipeline and readiness location
  bootstrap_rbac:
    type: json
    title: Cluster administrator binding for the bootstrap pipeline
  allocation:
    type: json
    title: Retained GPU allocation (absent when debug skipping is enabled)
variableGroups:
  - title: Existing cluster and GPU selection
    variables:
      [
        platform_name,
        compartment_id,
        cluster_id,
        availability_domain,
        gpu_shape,
        node_count,
        skip_gpu_allocation,
        advanced_settings
      ]
  - title: Platform and storage overrides
    visible: advanced_settings
    variables:
      [
        enable_lws,
        enable_disaggregated_set,
        monitoring_enabled,
        autoscaling_enabled,
        lws_mode,
        prometheus_mode,
        keda_mode,
        cluster_authorization_mode,
        rdma_mode,
        os_version,
        boot_volume_gib,
        gpu_image_id,
        rdma_resource_name,
        observation_id
      ]
  - title: Network overrides (must belong to the cluster VCN)
    visible: advanced_settings
    variables:
      [
        subnet_id,
        pod_subnet_id,
        devops_subnet_id,
        worker_nsg_ids,
        pod_nsg_ids,
        devops_nsg_ids
      ]
  - title: RMS context
    visible: false
    variables: [ tenancy_ocid, compartment_ocid, region ]
variables:
  cluster_authorization_mode:
    type: enum
    enum: [ iam, rbac ]
    default: iam
    title: Pipeline Kubernetes authorization
    description: IAM scopes Kubernetes administration to this cluster and the
      pipeline identities. RBAC requires applying the generated cluster role
      binding separately. Neither grants OCI node-pool administration to
      pipelines.
  tenancy_ocid:
    type: string
    required: true
    visible: false
  compartment_ocid:
    type: string
    visible: false
  region:
    type: string
    visible: false
    required: true
  platform_name:
    type: string
    default: llm-platform
    title: Stable platform name
    description: Keep this name independent of a model or discovery run. Use one
      platform owner per cluster.
  compartment_id:
    type: oci:identity:compartment:id
    default: compartment_ocid
    required: true
    title: Infrastructure compartment
  cluster_id:
    type: oci:container:cluster:id
    required: true
    title: Existing cluster
    dependsOn:
      compartmentId: compartment_id
  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    title: GPU availability domain from discovery
    dependsOn:
      compartmentId: compartment_id
  gpu_shape:
    type: string
    required: true
    title: GPU shape from discovery
  node_count:
    type: integer
    default: 1
    minimum: 1
    title: GPU host count (not GPU count)
  skip_gpu_allocation:
    type: boolean
    default: false
    title: Debug only — skip GPU allocation
    description: DevOps and shared CPU components are still created. Normally leave
      off. Never enable after GPU allocation; retained pools cannot be
      destroyed.
  advanced_settings:
    type: boolean
    default: false
    title: Show optional overrides
  enable_lws:
    type: boolean
    default: false
    title: Shared LeaderWorkerSet controller
  enable_disaggregated_set:
    type: boolean
    default: false
    title: Enable DisaggregatedSet in LWS
  monitoring_enabled:
    type: boolean
    default: true
    title: Prometheus monitoring
  autoscaling_enabled:
    type: boolean
    default: false
    title: KEDA workload autoscaling
    description: Installs the controller for the later model stack. GPU hosts stay
      allocated.
  lws_mode:
    type: enum
    enum: [ managed, reuse, retire ]
    default: managed
    title: LWS lifecycle
    description: Reuse validates an existing release. Retire retains a guarded
      uninstall pipeline; run it explicitly before removing the component.
  prometheus_mode:
    type: enum
    enum: [ managed, reuse, retire ]
    default: managed
    title: Prometheus lifecycle
  keda_mode:
    type: enum
    enum: [ managed, reuse, retire ]
    default: managed
    title: KEDA lifecycle
  rdma_mode:
    type: enum
    enum: [ auto, ethernet, rdma ]
    default: auto
    title: RDMA override
    description: Auto follows the discovery execution plan. A single-host layout
      does not require a fabric merely because its hardware supports RDMA.
  os_version:
    type: enum
    enum: [ "8", "9" ]
    default: "8"
    title: Oracle Linux major version
  boot_volume_gib:
    type: integer
    default: 200
    minimum: 200
    title: GPU host boot volume GiB
    description: Increase before allocation for large checkpoints and caches. Model
      disk sizing is deferred to model deployment.
  gpu_image_id:
    type: string
    title: Optional OKE GPU image OCID override
  rdma_resource_name:
    type: string
    title: Optional existing RDMA extended-resource name
  observation_id:
    type: string
    title: Optional capacity report identifier
    description: Leave unset to request a fresh report at each provisioning attempt.
  subnet_id:
    type: string
    title: GPU worker subnet OCID override
  pod_subnet_id:
    type: string
    title: VCN-native pod subnet OCID override
  devops_subnet_id:
    type: string
    title: DevOps runner subnet OCID override
    description: Must reach the private OKE API and have HTTPS egress for OCI and
      Helm release downloads.
  worker_nsg_ids:
    type: list
    default: "[]"
    valueType: nsg_id
    title: Worker NSG overrides
  pod_nsg_ids:
    type: list
    default: "[]"
    valueType: nsg_id
    title: Pod NSG overrides
  devops_nsg_ids:
    type: list
    default: "[]"
    valueType: nsg_id
    title: DevOps NSG overrides
  nsg_id:
    type: string
    visible: false
