title: Create an independent model DevOps project
description: Creates an independent model project and runs trusted namespace onboarding, model deployment and validation. Select an existing cluster with its retained GPU pool and required shared controllers already deployed. Apply waits for success and never allocates GPUs. Benchmarks remain manual.
schemaVersion: 1.1.0
version: '1.0'
locale: en
variableGroups:
  - title: Existing OKE cluster
    variables:
      - cluster_id
  - title: Optional overrides
    variables:
      - advanced_settings
  - title: Model and runtime
    variables: [ model_name, namespace, model_id, model_revision, serving_image, api_frontend, tensor_parallel_size, pipeline_parallel_size, hosts_per_replica, gpus_per_pod, replicas, context_length, concurrency, hf_token_secret ]
    visible: advanced_settings
  - title: Storage and routing
    variables: [ storage_mode, model_pvc_name, model_path, workspace_gib, router_enabled, routing_mode, lmcache_mode, lmcache_cpu_memory_gb, lmcache_chunk_size, lmcache_mamba_cache_mode ]
    visible: advanced_settings
  - title: Optional validation, benchmarking and scaling
    variables: [ monitoring_enabled, inference_probe, benchmark_mode, benchmark_backend, autoscaling_enabled, min_replicas, max_replicas, prometheus_url, target_inflight ]
    visible: advanced_settings
  - title: Optional network and staging configuration
    variables:
      - runner_subnet_id
      - runner_nsg_ids
      - rdma_resource_name
      - model_staging_image
      - model_staging_cpu_shape
    visible: advanced_settings
  - title: RMS context
    visible: false
    variables:
      - tenancy_ocid
      - compartment_ocid
      - region
  - title: Advanced target overrides (normally inferred)
    variables:
      - compartment_id
      - gpu_pool_id
      - gpu_pool_compartment_id
      - platform_name
    visible: advanced_settings
variables:
  tenancy_ocid: { type: string, visible: false }
  compartment_ocid: { type: string, visible: false }
  region:
    type: string
    visible: false
  model_name: { type: string, title: Model instance name }
  namespace: { type: string, title: Onboarded model namespace, description: Must remain under the infrastructure platform namespace prefix. }
  model_id: { type: string, title: Hugging Face repository }
  model_revision: { type: string, default: main, title: Hugging Face commit or main, description: Defaults to main for direct_hf. Discovery retains its assessed commit as evidence; retained PVC and staged snapshots require an explicit immutable commit. }
  serving_image: { type: string, title: Digest-pinned serving image }
  api_frontend:
    type: enum
    enum: [ python, rust ]
    default: python
    required: false
    title: vLLM API frontend
    description: Python is the compatible default, including when a recipe enables Rust. Opt into Rust after validating the model chat template, tool calling and required APIs. The pipeline frontend parameter remains editable.
  tensor_parallel_size: { type: integer, minimum: 1, title: Tensor parallel size within each host }
  pipeline_parallel_size: { type: integer, minimum: 1, title: Pipeline parallel size }
  hosts_per_replica: { type: integer, minimum: 1, title: Hosts per replica }
  gpus_per_pod: { type: integer, minimum: 1, title: GPUs per host pod }
  replicas: { type: integer, minimum: 1, title: Complete model replicas }
  context_length: { type: integer, minimum: 1, title: Context tokens per replica }
  concurrency: { type: integer, minimum: 1, title: Concurrent sequences per replica }
  hf_token_secret: { type: string, title: Existing Hugging Face token Secret, description: Optional Secret in the model namespace with key token. Supply its name only. }
  storage_mode: { type: enum, enum: [ direct_hf, existing_pvc, staged_object_storage ], default: direct_hf, title: Weight delivery }
  model_pvc_name: { type: string, title: Existing retained model PVC }
  model_path: { type: string, default: /models/model, title: Model path inside the mounted PVC }
  workspace_gib: { type: integer, minimum: 1, title: Local workspace GiB per serving pod }
  router_enabled: { type: boolean, default: false, title: Prefix-aware router, description: Automatically enabled for multiple replicas or an autoscaling maximum above one. }
  routing_mode: { type: enum, enum: [ auto, direct, prefixaware ], default: auto, title: Routing policy, description: KV-aware routing is unavailable with the pinned router. Generated model options include compatibility reasons. }
  lmcache_mode: { type: enum, enum: [ recipe, disabled, mp ], default: recipe, title: LMCache adapter, description: MP starts a local CPU cache process and requires a compatible image. Generated model bundles offer in-process mode only for assessed uniform attention layouts. }
  lmcache_cpu_memory_gb: { type: number, minimum: 1, title: LMCache CPU buffer GB, description: Optional override. Defaults to recipe setting or 8 GB. In-process buffers are budgeted per TP worker. }
  lmcache_chunk_size: { type: integer, minimum: 1, title: LMCache chunk size, description: Optional override. Defaults to recipe setting or 256 tokens; validate hybrid block geometry. }
  lmcache_mamba_cache_mode: { type: enum, enum: [ none, align ], title: Mamba cache policy, description: Optional recipe override for hybrid models. }
  inference_probe: { type: enum, enum: [ none, completions, chat ], default: none, title: Optional inference probe, description: Health and model identity are always checked. Other modalities need task-specific payloads. }
  benchmark_mode: { type: enum, enum: [ quick, full ], default: quick, title: Manual benchmark scope }
  benchmark_backend: { type: enum, enum: [ unsupported, openai, openai-chat ], default: openai-chat, title: Benchmark task adapter }
  autoscaling_enabled: { type: boolean, default: false, title: Enable request-based autoscaling, description: Uses retained KEDA/Prometheus and cannot grow beyond complete model slots in the retained GPU allocation. }
  monitoring_enabled: { type: boolean, default: true, title: Publish model monitoring resources, description: Uses retained Prometheus and ServiceMonitor support; does not install shared components. Autoscaling still requires platform metrics when this is off. }
  min_replicas: { type: integer, default: 1, minimum: 1, title: Minimum replicas }
  max_replicas: { type: integer, default: 1, minimum: 1, title: Maximum replicas }
  prometheus_url: { type: string, title: Existing Prometheus endpoint }
  target_inflight: { type: integer, default: 8, minimum: 1, title: Target in-flight requests per replica }
  compartment_id:
    type: oci:identity:compartment:id
    default: compartment_ocid
    required: false
    title: Model project compartment
  cluster_id:
    type: oci:container:cluster:id
    required: true
    title: Existing OKE cluster
    dependsOn:
      compartmentId: compartment_id
  gpu_pool_id:
    type: string
    required: false
    title: Optional existing GPU pool OCID
    description: Leave blank to discover a compatible retained managed GPU pool. A selected pool is read only and must carry the oke-llm/allocation label; no pool is created or changed. Apply requires the pool and trusted onboarding pipeline to exist.
  platform_name:
    type: string
    title: Expected infrastructure platform name
    description: Optional expected platform override. A unique compatible managed pool supplies this automatically. Apply requires the retained infrastructure and its trusted onboarding pipeline.
  runner_subnet_id:
    type: string
    required: false
    title: Optional runner subnet OCID
    description: Auto-detected from the existing cluster CPU pools. Override only if ambiguous; it must belong to the cluster VCN, support IPv4 and reach the Kubernetes API and OCI/Helm endpoints.
  runner_nsg_ids:
    type: list
    default: "[]"
    valueType: nsg_id
    title: Optional runner NSG OCIDs
  nsg_id:
    type: string
    visible: false
  gpu_pool_compartment_id:
    type: oci:identity:compartment:id
    required: false
    title: Optional GPU pool compartment
    description: Defaults to the selected pool compartment, or the cluster compartment while waiting for a future pool.
  rdma_resource_name:
    type: string
    required: false
    title: Optional existing RDMA extended resource
    description: No network plugin is installed by the model stack. Runtime validates the selected fabric/device resources.
  model_staging_image:
    type: string
    required: false
    title: Validated model stager image digest
    description: Required only for staged_object_storage. Build and validate model-storage/image/Dockerfile; no unverified image is assumed.
  model_staging_cpu_shape:
    type: string
    required: false
    title: Optional existing CPU shape for staging
    description: Defaults to the only CPU pool shape observed in this cluster. Staging never falls back to GPU nodes.
  advanced_settings:
    type: boolean
    default: false
    title: Show advanced options
    description: The model specification supplies recommended defaults. Change model, pool, project compartment or networking settings only when needed.
outputs:
  model_project:
    type: json
    title: Independent model DevOps project and artifact repositories
  target_preview:
    type: json
    title: Read-only cluster/network metadata and expected GPU target
  model_delivery:
    type: json
    title: Automatic model deployment and validation; manual benchmark and undeploy
  onboarding_arguments:
    type: json
    title: Trusted namespace onboarding arguments applied automatically
  model_storage:
    type: json
    title: Optional model-owned staging and retained data
  model_staging_bootstrap:
    type: json
    title: Explicit administrator bootstrap for optional CPU staging
