title: OKE LLM discovery
description: Inspect a public Hugging Face model and assess GPU shapes, entitlement and host capacity across READY subscribed regions. Creates no GPU instances.
schemaVersion: 1.1.0
version: "0.1.0"
variableGroups:
  - title: Model and serving assumptions
    variables: [model, revision, context_length, concurrency]
  - title: Capacity observation
    variables: [observation_id, compartment_id, regions, shape_names, query_resource_availability, only_shapes_with_limits]
  - title: OCI context
    visible: false
    variables: [tenancy_ocid, region]
variables:
  tenancy_ocid:
    type: string
    title: Tenancy OCID
    required: true
    visible: false
  region:
    type: oci:identity:region:name
    title: Internal RMS connection region
    description: Injected by RMS for initial contact only. Discovery uses OCI metadata to select the tenancy home region.
    required: true
    default: ${session.region}
    visible: false
  model_choice:
    type: string
    default: custom
    visible: false
    description: Legacy input retained for existing stacks. Supply model directly for new requests.
  model:
    type: string
    title: Hugging Face model URL or ID
    required: true
    description: Enter https://huggingface.co/owner/model or owner/model. Recipe coverage is checked separately from this input.
  revision:
    type: string
    title: Model revision
    default: main
  context_length:
    type: integer
    title: Context tokens per sequence
    minimum: 1
  concurrency:
    type: integer
    title: Concurrent sequences
    minimum: 1
  observation_id:
    type: string
    title: Capacity observation identifier
    description: Change for each new capacity report. Reusing this identifier preserves the previous snapshot.
  compartment_id:
    type: oci:identity:compartment:id
    title: Intended deployment compartment (optional)
    required: false
    description: Quota/headroom scope only; capacity uses tenancy root. Leaving unset checks root entitlement.
  regions:
    type: list
    valueType: region_scope_item
    required: false
    default: "[]"
    title: Optional region subset
    description: Empty means all READY subscribed regions.
  shape_names:
    type: list
    valueType: shape_scope_item
    required: false
    default: "[]"
    title: Optional GPU shape subset
    description: Empty means all visible GPU shapes.
  query_resource_availability:
    type: boolean
    title: Query supported limit headroom
  only_shapes_with_limits:
    type: boolean
    title: Only check shapes with configured limits
    default: false
    description: Skip confirmed zero-limit shapes. Leave disabled to find capacity for limit-increase requests. Unknown quota mappings remain included.
  region_scope_item:
    type: oci:identity:region:name
    title: Region to include
    visible: false
  shape_scope_item:
    type: string
    title: GPU shape name
    description: Exact OCI shape name, for example BM.GPU.H100.8. Leave the list empty to search all GPU shapes.
    visible: false
