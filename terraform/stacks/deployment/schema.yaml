title: OKE LLM deployment
description: Apply the selected discovery configuration to an existing regional OKE cluster. Creates billable GPU/CPU pools and DevOps resources; pipelines run separately.
schemaVersion: 1.1.0
version: "0.1.0"
variableGroups:
  - title: Discovery assessment
    variables: [discovery_json, selection_id]
  - title: Deployment target
    variables: [name, compartment_id, cluster_id, gpu_image_id, subnet_id, cpu_image_id, cpu_subnet_id, devops_subnet_id, pod_subnet_id, cpu_node_count, boot_volume_gib]
  - title: Deployment settings and overrides
    variables: [engine_channel, engine_version, engine_image, engine_platform, recipe_features, expert_configuration, expert_rank_memory_gib, engine_args, engine_env, node_count, tensor_parallel_size, pipeline_parallel_size, replicas, requires_rdma, context_length, concurrency, kv_dtype, runtime_gib, margin]
  - title: Delivery and benchmark
    variables: [install_gpu_operator, benchmark_requests, benchmark_input_tokens, benchmark_output_tokens, observation_id]
  - title: Legacy and derived inputs
    visible: false
    variables: [discovery, tenancy_ocid, region, availability_domain, gpu_shape, model, model_revision, serving_configuration, assessment_id]

variables:
  tenancy_ocid:
    type: string
    required: true
    visible: false
  name:
    type: string
    title: Name
  region:
    type: string
    title: Region
  compartment_id:
    type: string
    title: Compartment id
  cluster_id:
    type: string
    title: Cluster id
  availability_domain:
    type: string
    title: Availability domain
  gpu_shape:
    type: string
    title: Gpu shape
  node_count:
    type: integer
    title: Node count
  requires_rdma:
    type: boolean
    title: Requires rdma
  gpu_image_id:
    type: string
    title: Gpu image id
  subnet_id:
    type: string
    title: Subnet id
  cpu_image_id:
    type: string
    title: Cpu image id
  cpu_subnet_id:
    type: string
    title: Cpu subnet id
  devops_subnet_id:
    type: string
    title: Devops subnet id
  pod_subnet_id:
    type: string
    title: Pod subnet id
  cpu_node_count:
    type: integer
    title: Cpu node count
  boot_volume_gib:
    type: integer
    title: Boot volume gib
  model:
    type: string
    title: Model
  model_revision:
    type: string
    title: Model revision
  engine_image:
    type: string
    title: Engine image
  engine_version:
    type: string
    title: Engine version
  tensor_parallel_size:
    type: integer
    title: Tensor parallel size
  pipeline_parallel_size:
    type: integer
    title: Pipeline parallel size
  replicas:
    type: integer
    title: Replicas
  context_length:
    type: integer
    title: Context length
  concurrency:
    type: integer
    title: Concurrency
  kv_dtype:
    type: string
    title: Kv dtype
  runtime_gib:
    type: number
    title: Runtime gib
  margin:
    type: number
    title: Margin
  install_gpu_operator:
    type: boolean
    title: Install gpu operator
  benchmark_requests:
    type: integer
    title: Benchmark requests
  benchmark_input_tokens:
    type: integer
    title: Benchmark input tokens
  benchmark_output_tokens:
    type: integer
    title: Benchmark output tokens
  observation_id:
    type: string
    title: Observation id
  assessment_id:
    type: string
    title: Assessment id

  serving_configuration:
    type: text
    title: Frozen discovery configuration JSON
    required: false
    multiline: true
    description: Use the exact object exported by discovery; image and recipe are not looked up again during deployment.
  expert_configuration:
    type: boolean
    default: false
    title: Use expert supplied configuration
    description: The configuration is untested. Mandatory deployment validation still runs.
  expert_rank_memory_gib:
    type: number
    required: false
    title: Expert GPU memory bound per rank (GiB)
    description: Required when built-in per-rank estimation is unsupported. Include weights, KV and runtime overhead.
  engine_args:
    type: list
    valueType: engine_argument_item
    required: false
    title: Explicit serving argument override
  engine_argument_item:
    type: string
    visible: false
  engine_env:
    type: map
    valueType: engine_environment_item
    required: false
    title: Explicit serving environment override
  engine_environment_item:
    type: string
    visible: false

  discovery:
    type: text
    title: Discovery JSON
    required: false
    multiline: true
    description: Paste the single deployment_inputs JSON from discovery, including its discovery wrapper. Model, assessment and recipe/image evidence are loaded together.
  selection_id:
    type: string
    title: Assessment choice ID
    required: false
    description: Suggested configuration, candidate or expert GPU sizing option ID from discovery. Review warnings and recommended_selection_id; a sole choice is selected automatically.
  engine_channel:
    type: enum
    enum: [recommended, stable, nightly]
    default: recommended
    title: Assessed engine choice
  engine_platform:
    type: enum
    enum: [auto, linux/amd64, linux/arm64]
    default: auto
    title: Image platform
    description: Auto follows the selected GPU node CPU architecture.
  recipe_features:
    type: list
    valueType: recipe_feature_item
    default: "[]"
    required: false
    title: Optional recipe features
    description: Select feature keys reported by discovery, for example reasoning and tool_calling.
  recipe_feature_item:
    type: string
    visible: false

  discovery_json:
    type: text
    title: Discovery JSON
    required: false
    multiline: true
    description: Paste the entire deployment_inputs JSON from discovery. Model, assessment and recipe/image evidence are loaded together; placeholders remain literal data.
