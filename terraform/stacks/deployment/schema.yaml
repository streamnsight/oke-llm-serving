title: OKE LLM deployment
description: Apply the selected discovery configuration to an existing regional OKE cluster. Creates billable GPU/CPU pools and DevOps resources; pipelines run separately.
schemaVersion: 1.1.0
version: "0.1.0"
variableGroups:
  - title: Selected allocation
    variables: [name, region, compartment_id, cluster_id, availability_domain, gpu_shape, node_count, requires_rdma, gpu_image_id, subnet_id, cpu_image_id, cpu_subnet_id, devops_subnet_id, pod_subnet_id, cpu_node_count, boot_volume_gib]
  - title: Selected model and engine
    variables: [model, model_revision, engine_image, engine_version, tensor_parallel_size, pipeline_parallel_size, replicas, context_length, concurrency, kv_dtype, runtime_gib, margin]
  - title: Recipe and expert settings
    variables: [serving_configuration, expert_configuration, expert_rank_memory_gib, engine_args, engine_env]
  - title: Delivery and benchmark
    variables: [install_gpu_operator, benchmark_requests, benchmark_input_tokens, benchmark_output_tokens]
  - title: Discovery evidence
    variables: [observation_id, assessment_id]
  - title: Resource Manager context
    visible: false
    variables: [tenancy_ocid]
variables:
  tenancy_ocid:
    type: string
    required: true
    visible: false
  name:
    type: string
    title: Name
  region:
    type: string
    title: Region
  compartment_id:
    type: string
    title: Compartment id
  cluster_id:
    type: string
    title: Cluster id
  availability_domain:
    type: string
    title: Availability domain
  gpu_shape:
    type: string
    title: Gpu shape
  node_count:
    type: integer
    title: Node count
  requires_rdma:
    type: boolean
    title: Requires rdma
  gpu_image_id:
    type: string
    title: Gpu image id
  subnet_id:
    type: string
    title: Subnet id
  cpu_image_id:
    type: string
    title: Cpu image id
  cpu_subnet_id:
    type: string
    title: Cpu subnet id
  devops_subnet_id:
    type: string
    title: Devops subnet id
  pod_subnet_id:
    type: string
    title: Pod subnet id
  cpu_node_count:
    type: integer
    title: Cpu node count
  boot_volume_gib:
    type: integer
    title: Boot volume gib
  model:
    type: string
    title: Model
  model_revision:
    type: string
    title: Model revision
  engine_image:
    type: string
    title: Engine image
  engine_version:
    type: string
    title: Engine version
  tensor_parallel_size:
    type: integer
    title: Tensor parallel size
  pipeline_parallel_size:
    type: integer
    title: Pipeline parallel size
  replicas:
    type: integer
    title: Replicas
  context_length:
    type: integer
    title: Context length
  concurrency:
    type: integer
    title: Concurrency
  kv_dtype:
    type: string
    title: Kv dtype
  runtime_gib:
    type: number
    title: Runtime gib
  margin:
    type: number
    title: Margin
  install_gpu_operator:
    type: boolean
    title: Install gpu operator
  benchmark_requests:
    type: integer
    title: Benchmark requests
  benchmark_input_tokens:
    type: integer
    title: Benchmark input tokens
  benchmark_output_tokens:
    type: integer
    title: Benchmark output tokens
  observation_id:
    type: string
    title: Observation id
  assessment_id:
    type: string
    title: Assessment id

  serving_configuration:
    type: text
    title: Frozen discovery configuration JSON
    required: false
    multiline: true
    description: Use the exact object exported by discovery; image and recipe are not looked up again during deployment.
  expert_configuration:
    type: boolean
    default: false
    title: Use expert supplied configuration
    description: The configuration is untested. Mandatory deployment validation still runs.
  expert_rank_memory_gib:
    type: number
    required: false
    title: Expert GPU memory bound per rank (GiB)
    description: Required when built-in per-rank estimation is unsupported. Include weights, KV and runtime overhead.
  engine_args:
    type: list
    valueType: engine_argument_item
    required: false
    title: Explicit serving argument override
  engine_argument_item:
    type: string
    visible: false
  engine_env:
    type: map
    valueType: engine_environment_item
    required: false
    title: Explicit serving environment override
  engine_environment_item:
    type: string
    visible: false
