name: Tests (no cloud credentials)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rms-compatibility:
    name: RMS Terraform 1.5.7 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Validate entry and downstream roots with the RMS version
        shell: bash
        run: |
          set -euo pipefail
          for directory in . templates/infrastructure templates/llm-deployment; do
            terraform -chdir="$directory" init -backend=false -input=false -no-color
            terraform -chdir="$directory" validate -no-color
          done
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      directories: ${{ steps.tests.outputs.directories }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Discover Terraform test suites
        id: tests
        shell: bash
        run: |
          directories=$(find modules templates ./tests -type f -path '*/tests/*.tftest.hcl' -printf '%h\n' | sed 's|/tests$||' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "directories=$directories" >> "$GITHUB_OUTPUT"
  terraform:
    name: Terraform (${{ matrix.directory }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -no-color
      # Cloud providers are mocked by the test suites; no OCI credentials are supplied.
      - name: Run Terraform tests
        run: bash "$GITHUB_WORKSPACE/scripts/test-terraform.sh" "$PWD"
      - name: Verify the actually rendered infrastructure ZIP
        if: matrix.directory == 'modules/discovery/infrastructure-publisher'
        run: bash "$GITHUB_WORKSPACE/scripts/check-generated-infrastructure.sh" "$PWD/.generated/infrastructure-selected.zip"
      - name: Verify the actually rendered model ZIPs
        if: matrix.directory == 'modules/discovery/model-publisher'
        shell: bash
        run: |
          set -euo pipefail
          for bundle in "$PWD"/.generated/model-*.zip; do
            bash "$GITHUB_WORKSPACE/scripts/check-generated-model.sh" "$bundle"
          done
  scripts:
    name: JavaScript and shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install jq for shell fixtures
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: npm ci
      - run: npm test
