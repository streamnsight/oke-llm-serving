name: Package RMS stacks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Build and validate root-level stacks
        run: make check-packages
      - name: Publish discovery ZIP
        uses: actions/upload-artifact@v7
        with:
          path: work/packages/oke-llm-discovery.zip
          if-no-files-found: error
          archive: false
      - name: Publish deployment ZIP
        uses: actions/upload-artifact@v7
        with:
          path: work/packages/oke-llm-deployment.zip
          if-no-files-found: error
          archive: false
